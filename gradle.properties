# ---------------------------------------------------------------------------
# Gradle runtime flags
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
# Stonecutter + dual-Loom setups are not configuration-cache clean yet.
org.gradle.configuration-cache=false

# Speed hint for Loom when several version nodes share one daemon.
fabric.loom.multiProjectOptimisation=true

# ---------------------------------------------------------------------------
# Mod metadata (shared by every version node)
# ---------------------------------------------------------------------------
mod.id=thorium
mod.name=Thorium
mod.version=0.1.1
mod.group=dev.thorium
mod.author=Thorium Project
mod.license=All-Rights-Reserved
mod.description=Nuclear-grade client-side performance, chunk culling, and extreme FPS-boosting optimization engine for Minecraft.

# ---------------------------------------------------------------------------
# Shared dependency versions
# ---------------------------------------------------------------------------
deps.fabric-loader=0.19.5
